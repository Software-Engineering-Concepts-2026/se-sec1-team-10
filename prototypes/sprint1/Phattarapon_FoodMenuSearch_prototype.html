<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ค้นหาอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Phattarapon_FoodMenuSearch_style.css">
<script src="Phattarapon_FoodMenuSearch_script.js"></script>
</head>
<body>

  <!--
    A mobile app screen for browsing and searching food items.
    Structure:
    - A search input at the top with placeholder text "ค้นหาอาหาร"
    - Two pill-shaped filter buttons: "ประวัติ" (History) and "รายการโปรด" (Favorites)
    - A scrollable 2-column grid of 6 food cards
    - Each card: an image area with a food icon + name, and an info line below
  -->

  <div class="phone-frame">
    <div class="app-screen">

      <!-- Search bar -->
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" placeholder="ค้นหาอาหาร" aria-label="ค้นหาอาหาร">
      </div>

      <!-- Filter pills -->
      <div class="filter-row">
        <button class="pill">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          ประวัติ
        </button>
        <button class="pill">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20s-7-4.5-9.5-9A5.5 5.5 0 0112 5.5 5.5 5.5 0 0121.5 11c-2.5 4.5-9.5 9-9.5 9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          รายการโปรด
        </button>
      </div>

      <!-- Food grid -->
      <div class="food-grid">

        <a class="food-card" href="#">
          <div class="food-image food-image--somtam">
            <span class="food-emoji">🥗</span>
          </div>
          <div class="food-info">
            <p class="food-name">ส้มตำไทย</p>
            <p class="food-meta">฿45 · 4.8 ★</p>
          </div>
        </a>

        <a class="food-card" href="#">
          <div class="food-image food-image--padthai">
            <span class="food-emoji">🍜</span>
          </div>
          <div class="food-info">
            <p class="food-name">ผัดไทย</p>
            <p class="food-meta">฿55 · 4.6 ★</p>
          </div>
        </a>

        <a class="food-card" href="#">
          <div class="food-image food-image--greencurry">
            <span class="food-emoji">🍛</span>
          </div>
          <div class="food-info">
            <p class="food-name">แกงเขียวหวาน</p>
            <p class="food-meta">฿60 · 4.7 ★</p>
          </div>
        </a>

        <a class="food-card" href="#">
          <div class="food-image food-image--satay">
            <span class="food-emoji">🍢</span>
          </div>
          <div class="food-info">
            <p class="food-name">หมูสะเต๊ะ</p>
            <p class="food-meta">฿50 · 4.5 ★</p>
          </div>
        </a>

        <a class="food-card" href="#">
          <div class="food-image food-image--tomyum">
            <span class="food-emoji">🍲</span>
          </div>
          <div class="food-info">
            <p class="food-name">ต้มยำกุ้ง</p>
            <p class="food-meta">฿70 · 4.9 ★</p>
          </div>
        </a>

        <a class="food-card" href="#">
          <div class="food-image food-image--mango">
            <span class="food-emoji">🥭</span>
          </div>
          <div class="food-info">
            <p class="food-name">ข้าวเหนียวมะม่วง</p>
            <p class="food-meta">฿65 · 4.9 ★</p>
          </div>
        </a>

      </div>
    </div>
  </div>

</body>
</html>
