name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run tests and enforce coverage
        run: |
          python -m pytest src/tests -v --cov=src.fizzbuzz --cov=src.lab9_fizzbuzz_kata --cov=src.lab9_exercises --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90
